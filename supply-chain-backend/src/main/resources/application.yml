server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: supply-chain-backend
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/supply_chain_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.scm.module
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # Print SQL, parameters, and results directly to console.
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:ChangeThisToAtLeast256BitsOfRandomBase64OrHexSecretKeyForProductionUse}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.scm: INFO
    com.baomidou.mybatisplus: INFO
    # MyBatis SQL logs (Prepare/Parameters/Total) for CRUD tracing.
    org.apache.ibatis: INFO

# Integration toggles (production: replace stub / in-memory with real IPFS + FISCO BCOS clients)
scm:
  ipfs:
    mode: node
    api-url: http://127.0.0.1:5001
    gateway: http://127.0.0.1:8080/ipfs/
  blockchain:
    mode: fisco
    fisco:
      config-file: conf/config.toml
      group-id: 1
      contract-address: "0xb628b9140bbd1d4ecccc991434db7025d18a7836"
      abi-path: conf/abi
      bin-path: conf/bin
  scheduler:
    enabled: true
    # 扫描周期（毫秒）
    recall-scan-interval-ms: 60000
    # 同一“故障批次”在时间窗口内投诉数达到阈值 -> 自动生成召回通告
    recall-threshold-count: 3
    recall-threshold-window-minutes: 60
    # 自动生成召回通告时的默认状态（DRAFT/PUBLISHED）
    recall-notice-default-status: DRAFT
